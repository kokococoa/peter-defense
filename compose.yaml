x-ros: &ros
  image: ros-humble-peter
  build:
    context: ./ros/docker
  network_mode: host
  ipc: host
  init: true
  stdin_open: true
  tty: true
  environment:
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    ROS_LOCALHOST_ONLY: "0"
  volumes:
    - ./ros:/ros
  working_dir: /ros
  stop_grace_period: 15s

services:
  remote:
    <<: *ros
    profiles: [remote]
    container_name: ${PETER_CONTAINER_NAME:-ros-peter-remote}
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_LOCALHOST_ONLY: "0"
      PETER_SIDE: remote
    devices:
      - /dev/video0:/dev/video0
    command: [bash, /ros/ros_container.sh]
  main:
    <<: *ros
    profiles: [main]
    container_name: ${PETER_CONTAINER_NAME:-ros-peter-main}
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_LOCALHOST_ONLY: "0"
      PETER_SIDE: main
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /tmp/peter.xauthority
      QT_X11_NO_MITSHM: "1"
    volumes:
      - ./ros:/ros
      - type: bind
        source: /tmp/.X11-unix
        target: /tmp/.X11-unix
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${XAUTHORITY:-/dev/null}
        target: /tmp/peter.xauthority
        read_only: true
        bind:
          create_host_path: false
    command: [bash, /ros/ros_container.sh]
